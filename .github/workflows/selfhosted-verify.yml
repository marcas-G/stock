name: Selfhosted Verify (CH/全量)

# 自托管 runner：gpu-server-1（标签 factorlab；宿主有 ClickHouse + 在盘数据）。
# 触发只有手动 + 夜间：**不挂 pull_request**——公开仓 + 自托管 runner 的分叉 PR
# 是任意代码执行风险面（GitHub 官方安全建议：自托管 runner 仅配私有仓）。
# 本机出网阻断 github.com：本 workflow 不使用任何 marketplace action（含
# actions/checkout——改 git 直取）；远端动作下载若需要，请先在外部网络验证。
#
# 与 hosted CI 的分工：hosted 跑"干净 checkout 可绿"的离线门子集（ci.yml gates job；
# R37 起 hosted 无研究产物区，产物门显式 SKIP）。本 workflow 的独有价值 = **宿主数据面 +
# 研究产物区（QUANTRESEARCH_ROOT）**：产物门（lint-factors/索引/档案快照/tidy）在此跑全量。
#   - 去掉 hosted 的"数据在盘假设"排除项（本机真实有数据）；
#   - CH 集成腿 = `-m integration` +（ch / ST 显式降级 / 分钟缺覆盖 drop）三开关，
#     2026-09-19 实测 14 passed / 11 skipped / ~5min。**注意：平台单测口径≠CH 全量**
#     ——单测默认后端（duckdb/无库）会 skip CH 腿；给整包强加 ch 是错误口径
#     （大量红 + 单测数小时），不要那样跑。
#   - 不跑 `make gates` 全量：其中 G-REVIEWS 校验台账引用的 runs/... 产物路径、
#     G-DATAIFACE 含在途红——均为本机态门，干净 checkout 必红（见 ci.yml gates job 注释）。
#
# **不要给测试加 heavy.sh / 线程 env**（2026-09-19 实测教训）：heavy.sh 注入的
# FACTORLAB_MAX_MEMORY=8GB 会让断言"env 未设"的用例红；POLARS_MAX_THREADS=8 会改变
# 浮点求和顺序、撞上 backtest cash bridge 的**精确相等**校验（真 bug，见 R36-CI-I1）。
# 内存保护由 memguard 常驻守护兜底（重任务闸只管 factorlab/灌库等生产命令）。
on:
  workflow_dispatch:
  repository_dispatch:
    types: [selfhosted-verify]
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 北京 03:00（避开白天挖矿重任务）

permissions:
  contents: read

concurrency:
  group: selfhosted-verify
  cancel-in-progress: false

jobs:
  full-verify:
    name: 全量验证（CH + 在盘数据）
    runs-on: [self-hosted, factorlab]
    timeout-minutes: 120
    steps:
      # 不用 actions/checkout：github.com 在本机被阻断；git 走 SSH-over-443
      #（~/.ssh/config → ssh.github.com:443），且 runner 与仓库同机。
      # 全量 fetch（非 shallow）：档案时效门等需 git 历史。
      - name: 同步代码（git 直取）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          [ -d .git ] || git init -q
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin git@github.com:marcas-G/stock.git
          else
            git remote add origin git@github.com:marcas-G/stock.git
          fi
          if [ -f .git/shallow ]; then git fetch -q --unshallow origin; else git fetch -q origin; fi
          git checkout -q -f "$GITHUB_SHA"
          git clean -qfd
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log --oneline -1

      # 钉版与 hosted CI（.github/workflows/ci.yml）保持一致；pytest-timeout 也在此装
      #（pyproject 未声明，不装则 --timeout 参数报错）。用 uv：宿主已装 uv + cpython 3.13。
      - name: 环境（uv venv + editable 安装）
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP"/pytest-*.log
          UV=/home/gaolei/.local/bin/uv
          [ -x platform/.venv/bin/python ] || "$UV" venv --python 3.13 --seed platform/.venv
          "$UV" pip install -q --python platform/.venv/bin/python \
            -e "./platform[dev]" \
            "httpx==0.28.1" "polars==1.44.1" "typer==0.27.2" "rich==15.0.0" \
            "click==8.5.0" "pytest-timeout==2.4.0"

      # 平台全量（含 testpaths 限定的 platform/tests）：hosted 因数据不在盘排除的
      # test_factio 一条在此**不排除**（本机 data/fact 在盘）。rootdir=platform。
      - name: 平台全量 pytest（默认后端，~8min）
        working-directory: platform
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/pytest-platform.log"
          .venv/bin/python -m pytest -q --timeout=900 --timeout-method=thread \
            2>&1 | tee "$LOG"

      # CH 集成腿：真实 CH + 显式口径开关（ST 降级 / 分钟缺覆盖 drop）。
      # 2026-09-19 实测：14 passed / 11 skipped / ~5min（11 skip 为需 tick 的用例，
      # tick 全线暂停中；恢复 tick 后 skip 应收敛）。
      - name: CH 集成（-m integration，~5min）
        working-directory: platform
        env:
          FACTORLAB_DATA_BACKEND: ch
          FACTORLAB_ST_DEGRADE: allow
          FACTORLAB_MINUTE_UNCOVERED: drop
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/pytest-integration.log"
          .venv/bin/python -m pytest -q -m integration \
            --timeout=900 --timeout-method=thread \
            2>&1 | tee "$LOG"

      # platform/tools：hosted 的 2 条"数据在盘假设"排除项在此不排除（数据在盘）。
      # 排除项（仅此 2 条）：
      # - lob_fact tick e2e：tick 全线暂停 2026-09-19（issue #15；恢复 tick 时删除）；
      # - pan_update 同根守卫：断言 pan_update.repo_root() == factio.paths.STOCK_ROOT；
      #   本 workflow **刻意不设** FACTORLAB_STOCK_ROOT（数据测试要用宿主真实数据根，
      #   见文件头），checkout≠宿主根 → 该"同根"断言在 CI 语义下不成立。hosted CI 是
      #   设 FACTORLAB_STOCK_ROOT=checkout 来过的，两处口径不同、各自精确排除。
      - name: platform/tools 测试（在盘数据）
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/pytest-tools.log"
          platform/.venv/bin/python -m pytest platform/tools -q \
            --timeout=900 --timeout-method=thread \
            --deselect tools/lob_fact/tests/test_run_lob_batch.py::test_main_cli_e2e_mini_month \
            --deselect tools/pan_update/tests/test_config.py::test_pan_update_and_ingest_share_data_roots \
            2>&1 | tee "$LOG"

      # research/tools 排除项与 hosted CI 完全一致（2 条 strategies 预存红 = DQ
      # health 门对 2025-03 历史分区 UNKNOWN 的拒单；1 条档案时效门 72h 宽限，
      # 挖矿在途 2 spec 档案补齐后应删）。**不得扩大排除范围**。
      - name: research/tools 测试（排除 3 条在途/预存红）
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/pytest-research.log"
          platform/.venv/bin/python -m pytest research/tools -q \
            --timeout=900 --timeout-method=thread \
            --deselect tools/factor_lib/tests/test_index.py::test_every_yaml_has_mirror_doc_and_name_matches \
            --deselect tools/strategies/tests/test_run_strategy_cli.py::test_real_run_clean_window_2025_03 \
            --deselect tools/strategies/tests/test_run_strategy_cli.py::test_real_run_max_hold_excludes_stale_and_renormalizes \
            2>&1 | tee "$LOG"

      # R37：产物门对研究产物区（hosted 无该目录、ci.yml 守卫 SKIP；本机在盘跑全量）：
      # lint-factors / 三索引 byte-equality + 成对门 / 档案 snapshot / 目录公约报告。
      # 注：test_index 的档案时效门（宽限）在上面 research/tools 步仍按既有在途
      # deselect（2 个 momentum_20d 在途 spec，与 R37 迁移无关）；档案补齐后删 deselect。
      # research_tidy 当前预存 1 条遗留（产物区 results 根下的 bw.log，非迁移引入）——
      # 报告口径：退出非零只发 ::warning 不 fake 绿，整改后升级为硬门。
      - name: 研究产物门（QUANTRESEARCH_ROOT：lint/索引/档案快照/tidy）
        env:
          QUANTRESEARCH_ROOT: /data/students/gaolei/quantresearch
        run: |
          set -o pipefail
          make lint-factors
          make index-check
          platform/.venv/bin/python governance/evidence/verification/R21/EVID/annotate_factor_archives.py --check
          if ! platform/.venv/bin/python governance/ops/research_tidy.py; then
            echo "::warning::research_tidy 报告遗留（R37 预存：产物区 results 根下裸日志；整改后升级硬门）"
          fi

      - name: governance/ops 测试
        run: |
          set -o pipefail
          platform/.venv/bin/python -m pytest governance/ops -q --timeout=300 \
            2>&1 | tee "$RUNNER_TEMP/pytest-gov.log"

      - name: 失败注记（annotations）
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/pytest-*.log; do
            [ -f "$log" ] || continue
            grep -qE '^(FAILED|ERROR)' "$log" || continue
            echo "::error::—— $(basename "$log") FAILED ——"
            grep -E '^(FAILED|ERROR)' "$log" | head -25 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -10 "$log" | while IFS= read -r l; do
              echo "::error::$l"
            done
          done
