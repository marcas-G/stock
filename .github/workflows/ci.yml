# stock 单仓单树 CI（R38 精简：单入口 / 单 job / 无重复钉版）
#
# 命令真相源 = `governance/ops/verify.sh --profile fast`（云端等价档位）：
#   离线门子集（gates.sh --offline；产物区/台账门显式 SKIP）+ 三组 pytest（fast marker 表达式）。
# 环境钉版唯一出处 = `governance/ops/ci_env.sh`（本文件与旧三 job 的重复清单已删除；
# 数据在盘/CH/预存红的排除由测试 markers 承接，不再在 YAML 里 --deselect）。
# 本地/宿主深检走 `make verify-deep`（CH + 在盘数据 + 研究产物门）。
name: CI

on:
  push:
    branches: [restructure/monorepo]
  pull_request:
    branches: [restructure/monorepo]
  workflow_dispatch:

# 同 ref 新跑取消旧跑（省 runner 额度）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify-fast:
    name: verify --profile fast（无 CH / 无产物区）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout（fetch-depth: 0：档案时效等硬编码依赖 git 历史）"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ci_env.sh 需要一个 >=3.13 的基座解释器（platform requires-python >=3.13）；
      # 其余解释器/版本选择逻辑在 ci_env.sh 内（宿主 deep 复用同一脚本）。
      - name: Setup Python 3.13（ci_env 建 venv 基座）
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: 环境（ci_env：venv + editable + 钉版唯一出处）
        run: bash governance/ops/ci_env.sh

      - name: verify --profile fast（门 + 三组 pytest，失败不早退）
        run: |
          set -o pipefail
          bash governance/ops/verify.sh --profile fast 2>&1 | tee "$RUNNER_TEMP/verify-fast.log"

      # 失败时把 FAILED/ERROR 行以 ::error 注记发布——公开 annotations API 可读，
      # 便于无仓库 admin 权限时定位失败用例（日志下载 API 需 admin）。
      - name: 失败注记（从 verify 输出提取）
        if: failure()
        run: |
          log="$RUNNER_TEMP/verify-fast.log"
          if [ -f "$log" ]; then
            grep -E '^(FAILED|ERROR)' "$log" | head -25 | while IFS= read -r l; do
              echo "::error::$l"
            done
            echo "::error::—— verify 尾部 15 行 ——"
            tail -15 "$log" | while IFS= read -r l; do
              echo "::error::$l"
            done
          fi
