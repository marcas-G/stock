[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.1.0"
description = "Personal factor DSL computation platform"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.38",
    "numpy>=1.26",  # 逐周横截面 OLS（eval.cross_section）/ eval.correlation 运行时依赖
    "duckdb>=1.5",
    "pyarrow>=20,<21",  # 本机 glibc 2.27: >=21 无 cp313 manylinux wheel, 只能 20.x（R29：uv lock 需显式上界，否则解析到 25.x 源码构建必败）；Dependabot 大版本已屏蔽（.github/dependabot.yml ignore >=21），勿再上调
    "clickhouse-connect>=1.7",  # ClickHouse 读后端 (ch_source)
    "pyyaml>=6",
    "pydantic>=2.12",
    "pydantic-settings>=2.14",
    "expr-codegen>=0.16.6",
    "polars-ta>=0.5.17",
    "typer>=0.27",
    "rich>=14",
    "fastapi>=0.136",
    "uvicorn>=0.45",
    "jinja2>=3.1",
    "plotly>=6.7",
    "requests>=2.32",
    "psutil>=7.2",
    "pandas>=2",   # tools/ 直用（45 文件；此前只经 polars-ta 传递覆盖——R29 uv lock 显式声明）
    "openpyxl>=3.1",  # tools/ashare_ingest/import_daily 的 xlsx 解析（R29 uv lock 暴露缺失）
    # R30 Task 15（D12）：评估内核并入 factorlab.core.eval.kernel——独立 quant-core
    # dist/`kernels/` 壳删除，不再有第二份内核声明
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.7.1"]
dev = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
factorlab = "factorlab.surfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorlab = ["surfaces/web/templates/*.html", "surfaces/web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 依赖真实数据源（ClickHouse factorlab 库 / duckdb 平台库）的集成测试（数据源缺失时跳过）",
    # CI 档位 markers（名字冻结；权威 = knowledge/design/platform/specs/
    # 2026-09-21-cicd-streamlining-addendum.md §3/§4）：
    #   fast = not needs_ch and not data_on_disk and not host_root and not tick_paused and not inflight and not known_red
    #   deep = not tick_paused and not inflight and not known_red
    # 纪律：每个被标用例的邻近注释必须写原因与关联 issue；新增排除 = 新增带原因的 marker
    # （不回退硬编码 --deselect）。
    "needs_ch: 需要真 ClickHouse（fast 排除；deep 跑）——被标用例注释须带原因+issue",
    "data_on_disk: 依赖宿主在盘数据（data/runs 产物）；CI checkout 无大数据 → fast 排除，deep 在宿主树跑",
    "host_root: 断言工作区==宿主根（CI checkout 语义不成立）→ fast 排除，deep 在宿主树跑",
    "tick_paused: tick 全线暂停（GitHub issue #15；恢复时删标记）→ fast/deep 均排除",
    "inflight: 挖矿在途已知红（档案时效门；owner=挖矿流程；档案补齐即删）→ fast/deep 均排除",
    "known_red: 预存红（注释须带 issue 号与原因；修复后删标记）→ fast/deep 均排除",
]
