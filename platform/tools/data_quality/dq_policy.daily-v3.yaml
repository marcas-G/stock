unit_scale_repairs:
  # R37 T4（2026-09-20）：scope 内 55 行残余中 19 行现代单位 bug —— volume 源值
  # 以「手」计（漏 ×100），amount 正确。确证等级：
  #   15 行 bars_1m 分钟三角（m_volume/daily_volume=100.000、m_amount/daily_amount≈1，
  #        ×100 后 VWAP 落 OHLC 带；对照组同日正常日比值≈1）——证据
  #        governance/evidence/verification/R37/residual-55/minute-triangulation-19.{json,csv}；
  #    4 行（2015，bars_1m 自 2020-01-02 起无覆盖）vendor 源 xlsx（换手率随 volume
  #        塌缩 ~100×）+ 相邻日连续性（amount 平滑、volume 恰 ×100 断点）确证——同一签名。
  # 逐行对照表：residual-55/scoped-55-rows.csv、rca.md。
  # 行级守卫（validators）：仅当本行 VWAP 越带且 vwap/factor 落 [low,high]×(1±match_tol)
  # 才降级 WARN + repair 换算；未命中/换算后仍越带 → 照旧 ERROR quarantine（不洗白）。
  # 范围外/未确证行不得登记（loader 拒绝 scope 外键）；其余 36 行保持隔离披露。
