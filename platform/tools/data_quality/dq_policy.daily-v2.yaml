dq_policy_version: daily-v2
# daily-v2（Plan DQ-M1.5 T2，2026-09-19 控制者裁定）相对 daily-v1 的语义变更：
# 1) vwap.pre_1995_*：trade_date < 1995-01-01 的 VWAP 容差带 2%（>=1995 保持 1%）
#    —— 恢复 3 个整日 + 混合日边际行；覆盖上界 0.02/1.02≈1.96pp；
# 2) historic_unit_exceptions：登记（code 集合 × era）的早期单位约定 registry；
#    命中且 vwap/factor 落在 [low,high]×(1±match_tol) 内 → VWAP 降级 WARN + flag
#    HISTORIC_UNIT_EXCEPTION（行保留）；不得泛化到未登记代码/年代；
# 3) field_invalidity：adj_factor/fq_factor <= 0 → 该字段置 NULL + flag ADJ_NULLED，
#    OHLCV 不动、整行保留（不再整行 quarantine）。
partition_gate:
  pass:
    max_error_rate: 0.0001        # PASS 上界
    min_coverage: 0.999
  fail:
    min_error_rate: 0.01          # FAIL 下界（之间 = DEGRADED）
    max_missing_coverage: 0.01
systemic:
  field_share: 0.80
  field_count: 50
  group_ratio: 10.0
  group_count: 50
  time_share: 0.80
  time_count: 100
vwap:
  default_tol: 0.01
  pre_1995_tol: 0.02
  pre_1995_cutoff: "1995-01-01"
field_invalidity:
  null_on_nonpositive: ["adj_factor", "fq_factor"]
historic_unit_exceptions:
  - codes: ["000002.SZ", "000004.SZ"]
    before: "1994-01-01"
    factor: 5.0
    match_tol: 0.10
