name: small_cap_extreme
category: custom
direction: 1
universe:
  rules: {exclude_st: true, exchanges: ["SSE", "SZSE"]}
date:
  start: "2023-01-01"
  end: "2026-07-31"
process:
  - winsorize(quantile=0.99)
  - standardize()
formula: |
  from polars_ta.prefix.wq import cs_rank
  _sig = -log(circ_mv)
  _w = sign(sign(0.2 - cs_rank(circ_mv)) + 1) / 2
  signal = _sig * _w
