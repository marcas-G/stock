# 参考库（Reference Library，D10）——择优最小独立集，库级分析（corr/svd/resic）的默认对照。
#
# 权威定义：knowledge/design/platform/specs/2026-09-16-factorlab-eval-metrics-v2-design.md §3b。
# - 按**信号来源**分 scales（daily=日线原生信号 / minute=分钟聚合信号；两类不混用对照）；
# - `--target`（holding horizon）是评估参数，**不按 target 分库**（因子评估固定 1 日 forward）；
# - 入库四项：显著（|t|≥2 且 |IR|≥0.1）、独立（与库内 max|ρ|<0.7）、风格覆盖、可复跑（产物+档案）；
# - 建议门槛（真实对照后校准）：|ρ|max<0.7 且 残差 |t|≥2 且 retention≥50%；
# - 字段：name / style / reason / added / entry_corr_max / entry_resic_t
#   （entry_corr_max=入库时对库内其余成员 |ρ| 最大；entry_resic_t=对库内其余成员的
#   残差 t（有符号；判显著按 |t|）；种子在空库入场，两项=null）。
#
# 2026-09-17 初始批次校准（10 只；证据 governance/evidence/verification/R30/eval-v2-task14-12-11/）：
# - 库内 45 对 max|ρ|=0.490（rsi_reversal_14 × reversal_20d_netflow）——独立性达标；
# - 逐只对库内其余成员增量：可加入 2（turnover_accel / reversal_20d_overnight）、
#   观察 6、冗余 2（rsi_reversal_14 / amihud_illiq_turn_20d 的 retention<20%）；
#   冗余两只的候选替换（reversal_* 变体 8 只）实测同样冗余（retention≤7%），
#   故按初始 10 只保留并标记，待新风格合格候选入库时优先替换。
# - 注：retention≥50% 门槛对多成员库偏严（成员互为边际），新因子入库仍按建议门槛。
