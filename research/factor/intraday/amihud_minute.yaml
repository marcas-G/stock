name: intraday_amihud_minute
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _imp = if_else(amount > 0, abs(_r) / amount, None)
  signal = day_mean(_imp)
