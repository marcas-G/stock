name: intraday_gap_fill_ratio
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _auc = day_max(if_else(minute_index == 0, close, None))
  _den = _auc / prev_close - 1
  signal = if_else(abs(_den) > 0.001, (day_last(close) / _auc - 1) / _den, None)
