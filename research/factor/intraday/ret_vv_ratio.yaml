name: intraday_ret_vv_ratio
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _m = day_mean(_r)
  _mean_abs = day_mean(abs(_r))
  _m2 = day_mean(_r * _r)
  signal = _m2 / (_mean_abs * _mean_abs)
