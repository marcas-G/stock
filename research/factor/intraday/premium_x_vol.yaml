name: intraday_premium_x_vol
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _cont = day_max(if_else(minute_index == 237, close, None))
  _prem = if_else(_cont > 0, day_last(close) / _cont - 1, None)
  _int = day_sum(if_else(minute_index >= 238, volume, 0))
  signal = _prem * _int
