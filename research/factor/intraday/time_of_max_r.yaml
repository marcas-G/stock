name: intraday_time_of_max_r
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _ar = abs(_r)
  _mx = day_max(_ar)
  _at = if_else(_ar >= _mx, minute_index, 0)
  signal = day_max(_at) / 239
