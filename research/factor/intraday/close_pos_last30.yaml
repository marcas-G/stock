name: intraday_close_pos_last30
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _mx = day_max(if_else(minute_index >= 210, close, None))
  _mn = day_min(if_else(minute_index >= 210, close, None))
  signal = if_else(_mx - _mn > 0, (day_last(close) - _mn) / (_mx - _mn) - 0.5, None)
