name: intraday_event_density
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _m = day_mean(_r)
  _var = day_sum((_r - _m) * (_r - _m)) / 239
  signal = day_sum(if_else(abs(_r) > 2 * sqrt(_var), 1, 0))
