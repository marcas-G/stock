name: intraday_gap_fill_speed
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _fill = day_min(if_else(close >= prev_close, minute_index, None))
  signal = if_else(_fill >= 0, _fill / 239, 1)
