name: intraday_closing_auction_intensity
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _ca = day_sum(if_else(minute_index >= 238, volume, 0))
  _tot = day_sum(volume)
  signal = if_else(_tot > 0, _ca / _tot, None)
