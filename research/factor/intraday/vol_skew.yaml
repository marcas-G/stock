name: intraday_vol_skew
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _c = volume - day_mean(volume)
  _s3 = day_sum(_c * _c * _c)
  _s2 = day_sum(_c * _c)
  signal = if_else(_s2 > 0, _s3 / sqrt(_s2 * _s2 * _s2), None)
