name: intraday_close_ret
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _last = day_last(close)
  _cont_close = day_max(if_else(minute_index == 237, close, None))
  signal = _last / _cont_close - 1
