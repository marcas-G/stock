name: intraday_rv_term_structure
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _r2 = _r * _r
  _h1 = day_sum(if_else(minute_index <= 120, _r2, 0))
  _h2 = day_sum(if_else(minute_index > 120, _r2, 0))
  signal = if_else(_h2 > 0, _h1 / _h2, None)
