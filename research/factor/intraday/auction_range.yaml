name: intraday_auction_range
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _hi = day_max(if_else(minute_index == 0, high, None))
  _lo = day_max(if_else(minute_index == 0, low, None))
  signal = if_else(_lo > 0, _hi / _lo - 1, None)
