name: intraday_ret_concentration
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _max = day_max(abs(_r))
  _sum = day_sum(abs(_r))
  signal = _max / _sum
