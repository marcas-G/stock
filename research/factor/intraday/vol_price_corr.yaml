name: intraday_vol_price_corr
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _m_r = day_mean(_r)
  _m_v = day_mean(volume)
  _num = day_sum((_r - _m_r) * (volume - _m_v))
  _den_r = day_sum((_r - _m_r) * (_r - _m_r))
  _den_v = day_sum((volume - _m_v) * (volume - _m_v))
  signal = _num / sqrt(_den_r * _den_v)
