name: intraday_path_efficiency
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _day_ret = day_last(close) / day_first(close) - 1
  _path_len = day_sum(abs(_r))
  signal = abs(_day_ret) / _path_len
