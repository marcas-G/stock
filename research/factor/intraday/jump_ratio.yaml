name: intraday_jump_ratio
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _r2 = _r * _r
  _ab = abs(_r) * abs(im_delay(_r, 1))
  _bv = 1.5708 * day_sum(_ab)
  _rv = day_sum(_r2)
  signal = if_else(_rv > 0, if_else(1 - _bv / _rv > 0, 1 - _bv / _rv, 0), None)
