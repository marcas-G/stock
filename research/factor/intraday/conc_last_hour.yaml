name: intraday_conc_last_hour
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _late = day_sum(if_else(minute_index >= 210, abs(_r), 0))
  _tot = day_sum(abs(_r))
  signal = if_else(_tot > 0, _late / _tot, None)
