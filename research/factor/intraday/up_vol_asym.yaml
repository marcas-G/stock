name: intraday_up_vol_asym
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _uv = day_sum(if_else(_r > 0, volume, 0))
  _dv = day_sum(if_else(_r < 0, volume, 0))
  signal = if_else(_dv > 0, _uv / _dv, None)
