name: intraday_vwap_ret_spread
category: custom
direction: 1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _r = close / im_delay(close, 1) - 1
  _vwm = day_sum(_r * volume) / day_sum(volume)
  _ewm = day_mean(_r)
  signal = if_else(day_sum(volume) > 0, _vwm - _ewm, None)
