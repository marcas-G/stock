name: intraday_cn_spread
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _a = high / open - 1
  _b = low / close - 1
  _p = _a * _b
  _s = day_sum(_p)
  signal = if_else(_s < 0, sqrt(-_s), 0)
