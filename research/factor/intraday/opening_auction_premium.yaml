name: intraday_opening_auction_premium
category: custom
direction: -1
interface: bars_1m
adjustment: raw
universe:
  ref: bars1m_2023_2025
date:
  start: "2023-01-01"
  end: "2025-12-31"
formula: |
  _auc = day_max(if_else(minute_index == 0, close, None))
  _m1 = day_max(if_else(minute_index == 1, close, None))
  signal = if_else(_m1 > 0, _auc / _m1 - 1, None)
