name: low_vol_20d_park_gk
category: custom
direction: 1
universe:
  rules: {exclude_st: true, exchanges: ["SSE", "SZSE"]}
date:
  start: "2023-01-01"
  end: "2026-07-31"
process:
  - winsorize(quantile=0.99)
  - standardize()
formula: |
  from polars_ta.prefix.wq import ts_mean, log
  _hl = log(high / low)
  _co = log(close / open)
  signal = -ts_mean(0.5 * _hl * _hl - 0.386294 * _co * _co, 20)
