name: low_downside_vol_20d
category: custom
direction: 1
universe:
  rules: {exclude_st: true, exchanges: ["SSE", "SZSE"]}
date:
  start: "2023-01-01"
  end: "2026-07-31"
process:
  - winsorize(quantile=0.99)
  - standardize()
formula: |
  from polars_ta.prefix.wq import ts_std_dev
  _neg = (returns(close) - abs(returns(close))) / 2
  signal = -ts_std_dev(_neg, 20)
