# 研究树（单仓单树）：不承载平台包，不是可分发项目。
# 平台共享核在单树的兄弟目录（platform/src），研究工具经
# tools/_env.py 注入并断言落位（DER-010）；本文件只为 pytest 配置与依赖声明存在。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Research tools on top of the shared factorlab core (stock/platform/src)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.38",
    "pandas",
    "numpy>=1.26",
    "pyarrow>=20",  # 本机 glibc 2.27: >=21 无 cp313 manylinux wheel, 只能 20.x
    "clickhouse-connect>=1.7",  # ch_ingest 灌入/对账
    "pyyaml>=6",  # ch_ingest config.yaml
    "psutil>=7.2",  # 批算资源审计
    "openpyxl>=3.1",  # ashare_ingest/import_daily（通达信 xlsx 导出解析）
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = []  # 研究树不分发任何包（工具按脚本运行）

[tool.pytest.ini_options]
testpaths = ["tools"]
markers = [
    "integration: 依赖真实数据源（ClickHouse factorlab 库 / 本地事实库）的集成测试（数据源缺失时跳过）",
    # CI 档位 markers（名字冻结；权威 = knowledge/design/platform/specs/
    # 2026-09-21-cicd-streamlining-addendum.md §3/§4）：
    #   fast = not needs_ch and not data_on_disk and not host_root and not tick_paused and not inflight and not known_red
    #   deep = not tick_paused and not inflight and not known_red
    # 纪律：每个被标用例的邻近注释必须写原因与关联 issue；新增排除 = 新增带原因的 marker
    # （不回退硬编码 --deselect）。
    "needs_ch: 需要真 ClickHouse（fast 排除；deep 跑）——被标用例注释须带原因+issue",
    "data_on_disk: 依赖宿主在盘数据（data/runs 产物）；CI checkout 无大数据 → fast 排除，deep 在宿主树跑",
    "host_root: 断言工作区==宿主根（CI checkout 语义不成立）→ fast 排除，deep 在宿主树跑",
    "tick_paused: tick 全线暂停（GitHub issue #15；恢复时删标记）→ fast/deep 均排除",
    "inflight: 挖矿在途已知红（档案时效门；owner=挖矿流程；档案补齐即删）→ fast/deep 均排除",
    "known_red: 预存红（注释须带 issue 号与原因；修复后删标记）→ fast/deep 均排除",
]
